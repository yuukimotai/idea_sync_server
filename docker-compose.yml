services:
  app:
    build: .
    command: bundle exec puma -C config/puma.rb
    ports:
      - "2300:2300"
    environment:
      DATABASE_URL: postgres://postgres:password@db/hanami_auth_app_development
      SESSION_SECRET: dev-secret-please-change-in-production-must-be-at-least-64-characters-long
      HANAMI_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle

  ws:
    build: .
    command: bundle exec falcon serve --count 1 --bind tcp://0.0.0.0:3001 --config cable.ru
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:password@db/hanami_auth_app_development
      HANAMI_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle

  client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      RUBY_API_URL: http://app:2300
      NEXT_PUBLIC_WS_URL: ws://localhost:3001/cable
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ../javascript/idea_sync_client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - app
      - ws

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hanami_auth_app_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  bundle_cache:
  client_node_modules:
