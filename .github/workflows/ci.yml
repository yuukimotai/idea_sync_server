name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hanami_auth_app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v5

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Drop and setup test database
      env:
        DATABASE_URL: postgres://postgres:password@localhost:5432/hanami_auth_app_test
      run: |
        bundle exec hanami db drop 2>/dev/null || true
        bundle exec hanami db create
        bundle exec hanami db migrate

    - name: Run RSpec
      env:
        DATABASE_URL: postgres://postgres:password@localhost:5432/hanami_auth_app_test
        HANAMI_ENV: test
      run: bundle exec rspec spec/usecases/account/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: idea_sync_server:ci-${{ github.sha }}
